# Sheela log rotation.
#
# Install with:
#   sudo cp /home/sheela/bot/deploy/sheela-logrotate.conf /etc/logrotate.d/sheela
# Test with:
#   sudo logrotate -d /etc/logrotate.d/sheela          # dry-run
#   sudo logrotate -f /etc/logrotate.d/sheela          # force rotate now
#
# Ubuntu's /etc/cron.daily/logrotate runs this every day automatically; the
# "weekly" directive below scopes the actual rotation to once a week.
#
# copytruncate is used so the running bot's open file descriptors keep
# writing to the (now-empty) file with the same inode — no service restart
# or SIGHUP required.

/home/sheela/logs/*.log /home/sheela/logs/*.jsonl {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    create 0644 sheela sheela
    sharedscripts
    copytruncate
}
