[project]
name = "sheela"
version = "0.1.0"
description = "Sheela — a personal Discord-based AI assistant. Step 1: hello world."
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4.0",
    "google-genai>=1.0.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sheela"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
